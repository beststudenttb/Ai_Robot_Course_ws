mecanum_driver:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    tracker_state_topic: /tracker_state
    wheel_radius: 0.05
    half_length: 0.15
    half_width: 0.12
    heading_gain: 0.8
    motor1_name: motor1
    motor2_name: motor2
    motor3_name: motor3
    motor4_name: motor4

decision:
  ros__parameters:
    default_target: A_point
    A_point_x: 14.0
    A_point_y: 0.0
    B_point_x: 14.0
    B_point_y: 14.0
    C_point_x: 0.0
    C_point_y: 14.0
    slow_speed: 0.25
    slowdown_distance: 3.0
    yellow_distance: 3.0
    stop_distance: 0.05

mission:
  ros__parameters:
    target_sequence: [A_point, B_point, C_point]
    retry_delay: 1.0
